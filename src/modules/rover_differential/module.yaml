module_name: Rover Differential

parameters:
  - group: Rover Differential
    definitions:
      RD_WHEEL_TRACK:
          description:
            short: Wheel track
            long: Distance from the center of the right wheel to the center of the left wheel.
          type: float
          unit: m
          min: 0
          max: 100
          increment: 0.001
          decimal: 3
          default: 0

      RD_TRANS_TRN_DRV:
        description:
            short: Yaw error threshold to switch from spot turning to driving
            long: |
              This threshold is used for the state machine to switch from turning to driving based on the
              error between the desired and actual yaw.
        type: float
        unit: rad
        min: 0.001
        max: 3.14159
        increment: 0.01
        decimal: 3
        default: 0.0872665

      RD_TRANS_DRV_TRN:
        description:
            short: Yaw error threshold to switch from driving to spot turning
            long: |
              This threshold is used for the state machine to switch from driving to turning based on the
              error between the desired and actual yaw. It is also used as the threshold whether the rover should come
              to a smooth stop at the next waypoint. This slow down effect is active if the angle between the
              line segments from prevWP-currWP and currWP-nextWP is smaller then 180 - RD_TRANS_DRV_TRN.
        type: float
        unit: rad
        min: 0.001
        max: 3.14159
        increment: 0.01
        decimal: 3
        default: 0.174533

      RD_ACC_RAD_MARGN:
        description:
            short: A multiplier for the acceptance radius to start braking early
            long: |
              A higher value will cause the rover to start braking earlier when approaching a "stopping" waypoint.
        type: float
        unit: norm
        min: 0.5
        max: 3.0
        increment: 0.01
        decimal: 2
        default: 1.0

      LM_YAW_RATE_P:
        description:
            short: A P gain for the yaw rate control in line following mode
            long: |
              A higher value will cause the rover to turn more aggressively during line following. Set to 0 to disable switching.
        type: float
        unit: norm
        min: 0
        max: 100
        increment: 0.01
        decimal: 2
        default: 0.0

      LM_YAW_RATE_I:
        description:
            short: A I gain for the yaw rate control in line following mode
            long: |
              A higher value will cause the rover to turn more aggressively during line following.
        type: float
        unit: norm
        min: 0
        max: 10000
        increment: 0.01
        decimal: 2
        default: 0.0

      LM_YAW_RATE_LIM:
        description:
            short: Yaw rate limit in line following mode
            long: |
              Used to cap yaw rate setpoints and map controller inputs to yaw rate setpoints in line following mode.
        type: float
        unit: deg/s
        min: 0
        max: 10000
        increment: 0.01
        decimal: 2
        default: 0.0

      LM_YAW_P:
        description:
            short: Proportional gain for closed loop yaw controller in line following mode
        type: float
        unit: norm
        min: 0
        max: 100
        increment: 0.01
        decimal: 3
        default: 0.0

      LM_YAW_RATE_T_P:
        description:
            short: A P gain for the yaw rate control in spot turns
            long: |
              A higher value will cause the rover to turn more aggressively during spot turns. Set to 0 to disable switching.
        type: float
        unit: norm
        min: 0
        max: 100
        increment: 0.01
        decimal: 2
        default: 0.0

      LM_YAW_RATE_T_I:
        description:
            short: A I gain for the yaw rate control in spot turns
            long: |
              A higher value will cause the rover to turn more aggressively during spot turns.
        type: float
        unit: norm
        min: 0
        max: 10000
        increment: 0.01
        decimal: 2
        default: 0.0

      LM_YAW_RATE_TLIM:
        description:
            short: Yaw rate limit in spot turns
            long: |
              Used to cap yaw rate setpoints and map controller inputs to yaw rate setpoints in spot turns.
        type: float
        unit: deg/s
        min: 0
        max: 10000
        increment: 0.01
        decimal: 2
        default: 0.0

      LM_YAW_T_P:
        description:
            short: Proportional gain for closed loop yaw controller in spot turns
        type: float
        unit: norm
        min: 0
        max: 100
        increment: 0.01
        decimal: 3
        default: 0.0

      RD_YAW_STK_GAIN:
        description:
            short: Yaw stick gain for Manual mode
            long: Assign value <1.0 to decrease stick response for yaw control.
        type: float
        min: 0.1
        max: 1
        increment: 0.01
        decimal: 3
        default: 1
