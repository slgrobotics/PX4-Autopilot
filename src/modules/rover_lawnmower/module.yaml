module_name: Rover Lawnmower

parameters:
  - group: Rover Lawnmower
    definitions:

      LM_TRACING_LEV:
        description:
          short: Tracing level, 5 - High  0 - no tracing
        type: enum
        default: 0
        values:
          0: None
          1: Low1
          2: Low2
          3: Moderate
          4: High
          5: Highest

      LM_GPS_MINFIX:
        description:
          short: Minimal GPS fix
          long: Minimum GPS fix (horn sounds if GPS fix is less than this value)
        type: int32
        default: 6
        min: 3
        max: 6

      LM_STATS_DIST:
        description:
          short: Distance from both waypoints when accumulate crosstrack error statistics is enabled
          long: If the distance is less than this value, the crosstrack error statistics will not be accumulated for leg or mission metrics.
        type: float
        unit: m
        min: 1
        max: 200
        increment: 0.1
        decimal: 1
        default: 2.0

      LM_ACCEL_DIST:
        description:
          short: Distance to accelerate from a waypoint
        type: float
        unit: m
        min: 1
        max: 200
        increment: 0.1
        decimal: 1
        default: 1.0

      LM_DECEL_DIST:
        description:
          short: Distance to decelerate straight to a waypoint not using any Pursuit logic
        type: float
        unit: m
        min: 1
        max: 200
        increment: 0.1
        decimal: 1
        default: 1.0

      LM_ICE_IDLE:
        description:
          short: Gas engine throttle level when idle
        type: float
        unit: norm
        min: 0
        max: 1.0
        increment: 0.01
        decimal: 2
        default: 0

      LM_ICE_DEPART:
        description:
          short: Gas engine throttle level in departing
        type: float
        unit: norm
        min: 0
        max: 1.0
        increment: 0.01
        decimal: 2
        default: 0.8

      LM_ICE_TURN:
        description:
          short: Gas engine throttle level in turns
        type: float
        unit: norm
        min: 0
        max: 1.0
        increment: 0.01
        decimal: 2
        default: 0.2

      LM_ICE_ARRIVE:
        description:
          short: Gas engine throttle level in arriving
        type: float
        unit: norm
        min: 0
        max: 1.0
        increment: 0.01
        decimal: 2
        default: 0.8

      LM_ICE_STRAIGHT:
        description:
          short: Gas engine throttle level on straight run
        type: float
        unit: norm
        min: 0
        max: 1.0
        increment: 0.01
        decimal: 2
        default: 1.0
